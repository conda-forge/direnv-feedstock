context:
  name: direnv
  version: "2.38.1"

package:
  name: ${{ name|lower }}
  version: ${{ version|replace("-", "_") }}

source:
  - target_directory: src
    url: https://github.com/direnv/direnv/archive/v${{ version }}.tar.gz
    sha256: 3bd0d49c163204543db8f22f55af8985121db24fe6b21c5b749695e4fbdbb1fe

build:
  number: 0
  script:
    - pushd src
    - if: unix
      then:
        - go build -v -ldflags "-X main.revision=conda-forge" -o $PREFIX/bin/direnv
      else:
        - go build -v -ldflags "-X main.revision=conda-forge" -o %LIBRARY_BIN%\direnv.exe
    - go-licenses save . --save_path=${{ SRC_DIR }}/license_files || true


requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - direnv --version

about:
  homepage: https://github.com/direnv/direnv
  license: MIT
  license_file:
    - src/LICENSE
    - license_files/
  summary: unclutter your .profile

extra:
  recipe-maintainers:
    - daizeng1984
    - wolfv
